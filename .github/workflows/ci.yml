name: Qizzone Enterprise CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  validate-and-build:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./qizzone

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./qizzone/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: TypeScript Compile & Vite Production Build
        run: npm run build
