name: qizzone-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qizzone}
      POSTGRES_USER: ${POSTGRES_USER:-qizzone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - qizzone_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    profiles: [migration]
    image: mcr.microsoft.com/dotnet/sdk:10.0.404
    working_dir: /src
    volumes:
      - ../backend:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Qizzone: Host=postgres;Port=5432;Database=${POSTGRES_DB:-qizzone};Username=${POSTGRES_USER:-qizzone};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    entrypoint: [sh, -c]
    command:
      - dotnet tool restore && dotnet tool run dotnet-ef -- database update --project Qizzone.Api --startup-project Qizzone.Api
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Qizzone: Host=postgres;Port=5432;Database=${POSTGRES_DB:-qizzone};Username=${POSTGRES_USER:-qizzone};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      Firebase__ServiceAccountJson: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      Admin__BootstrapUids__0: ${BOOTSTRAP_ADMIN_UID:-}
      Cors__AllowedOrigins__0: http://localhost:5173
      AllowedHosts: 'localhost;127.0.0.1;api'
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: [ai]
    build:
      context: ../backend
      dockerfile: Qizzone.Worker/Dockerfile
    environment:
      ConnectionStrings__Qizzone: Host=postgres;Port=5432;Database=${POSTGRES_DB:-qizzone};Username=${POSTGRES_USER:-qizzone};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: [web]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../qizzone:/app
      - qizzone_frontend_node_modules:/app/node_modules
    command: [sh, -c, 'npm ci && npm run dev -- --host 0.0.0.0']
    environment:
      VITE_QIZZONE_API_BASE_URL: http://localhost:${API_PORT:-8080}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-5173}:5173
    restart: unless-stopped

volumes:
  qizzone_postgres_data:
  qizzone_frontend_node_modules:
